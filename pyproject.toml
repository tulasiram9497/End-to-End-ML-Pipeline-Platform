[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-forge"
version = "0.1.0"
description = "End-to-end AutoML platform for tabular datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.1",
  "pydantic>=2.8.2",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "scikit-learn>=1.4.2",
  "scipy>=1.13.0",
  "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "black>=24.4.2",
  "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
